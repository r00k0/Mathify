<title>Mathify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one graph-paper work column. Kip the kangaroo speaks in yellow bubbles; problem cards are white sheets. */
:root{
  --paper:#F3F6FB; --grid:#E0E7F1; --card:#FFFFFF; --ink:#17213B; --muted:#5A6582; --line:#D2DBE8;
  --accent:#E2570B; --accent-ink:#FFFFFF; --accent-soft:#FDE7D9;
  --kip:#FFF1BC; --kip-ink:#463600; --fur:#C47A3F; --fur-in:#F3CDA3;
  --good:#16865A; --good-soft:#DCF2E7; --bad:#C63838; --bad-soft:#FBE2E2; --blue:#2C5BD6; --blue-soft:#E2EAFD;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F131C; --grid:#18202E; --card:#161C29; --ink:#E7ECF5; --muted:#9AA6C0; --line:#2A3347;
  --accent:#FF8A3D; --accent-ink:#1A0E05; --accent-soft:#3A2414; --kip:#3A3315; --kip-ink:#FBE9A6; --fur:#D99257; --fur-in:#6B4A2C;
  --good:#46C98B; --good-soft:#153326; --bad:#FF7B7B; --bad-soft:#3A1C1C; --blue:#8DB0FF; --blue-soft:#1C2742; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F131C; --grid:#18202E; --card:#161C29; --ink:#E7ECF5; --muted:#9AA6C0; --line:#2A3347;
  --accent:#FF8A3D; --accent-ink:#1A0E05; --accent-soft:#3A2414; --kip:#3A3315; --kip-ink:#FBE9A6; --fur:#D99257; --fur-in:#6B4A2C;
  --good:#46C98B; --good-soft:#153326; --bad:#FF7B7B; --bad-soft:#3A1C1C; --blue:#8DB0FF; --blue-soft:#1C2742; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:25px;display:flex;align-items:center;gap:8px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{font:500 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button{font-family:var(--body)} button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13.5px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.btn{border:none;border-radius:10px;padding:10px 16px;font:600 15px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.dark{background:var(--ink);color:var(--paper)}
.btn.soft{background:var(--kip);color:var(--kip-ink)} .btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
/* Kip */
.kip{display:flex;gap:12px;align-items:flex-start}
.kip svg.face{flex:0 0 auto;width:54px;height:54px}
.bubble{background:var(--kip);color:var(--kip-ink);border-radius:14px;padding:12px 15px;position:relative;flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--kip);border-left:0}
.bubble .who{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.bubble p{margin-top:4px;font-size:16.5px}
.mn{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;border:2px dashed currentColor;font-weight:600}
/* SPOT strip */
.spot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.spot{grid-template-columns:repeat(2,1fr)}}
.spot div{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;color:var(--muted);background:var(--card)}
.spot b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.spot b span{color:var(--accent)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;width:100%}
.item:hover{border-color:var(--accent)} .item .l{min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap} .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.clean{background:var(--good);border-color:var(--good)} .dot.helped{background:var(--kip);border-color:#C9A500} .dot.shown{background:var(--bad-soft);border-color:var(--bad)}
/* problem */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-weight:700;font-size:20px;padding:4px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--accent);border-color:var(--accent)} .timer.over{color:var(--bad);border-color:var(--bad)}
.ptext{font-size:19px;line-height:1.6} .book{font-size:18px}
.book b{font-family:var(--display)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.optw{position:relative}
.opt{width:100%;padding:12px 38px 12px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 16px var(--body);cursor:pointer;text-align:left}
.opt .k{font-family:var(--mono);font-weight:700;margin-right:6px;color:var(--accent)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.x{opacity:.45;text-decoration:line-through} .opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;opacity:.7} .opt.right{border-color:var(--good);background:var(--good-soft)}
.xbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:700 14px var(--mono);cursor:pointer}
.xbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input.num{font:600 20px var(--mono);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:180px;max-width:100%}
.result{border-radius:12px;padding:16px} .result.good{background:var(--good-soft)} .result.bad{background:var(--bad-soft)}
.why{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.shake{animation:shake .35s} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .45s ease-out} @keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 14px var(--body);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg.fig{max-width:100%;height:auto;display:block;margin:6px 0}
/* moves */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.move{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 13px var(--mono);background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.move .t{font-family:var(--display);font-weight:800;font-size:17px}
.move .m{font-weight:600}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600} td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px} .bar i{display:block;height:100%;background:var(--good)}
.alert{background:var(--bad-soft);border-radius:12px;padding:14px 16px}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px} @media (max-width:480px){.qgrid{grid-template-columns:repeat(6,1fr)}}
.qb{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--mono);cursor:pointer;max-width:100%}
.qb.ans{background:var(--accent-soft);border-color:var(--accent)} .qb.cur{outline:2px solid var(--ink)}
.level{display:flex;gap:4px} .level i{width:22px;height:8px;border-radius:4px;background:var(--line)} .level i.on{background:var(--accent)}
a{color:var(--blue)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span id="logo"></span>Mathify</div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="today">Kangaroo</button>
      <button data-tab="learn">Learn K–12</button>
      <button data-tab="moves">Kip's moves</button>
      <button data-tab="test">Tests</button>
      <button data-tab="coach">Coach</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
/* =================== Kip =================== */
const KIP = `<svg class="face" viewBox="0 0 64 64" aria-hidden="true">
<ellipse cx="19" cy="15" rx="7" ry="15" transform="rotate(-18 19 15)" fill="var(--fur)"/><ellipse cx="45" cy="15" rx="7" ry="15" transform="rotate(18 45 15)" fill="var(--fur)"/>
<ellipse cx="19" cy="16" rx="3.4" ry="10" transform="rotate(-18 19 16)" fill="var(--fur-in)"/><ellipse cx="45" cy="16" rx="3.4" ry="10" transform="rotate(18 45 16)" fill="var(--fur-in)"/>
<ellipse cx="32" cy="38" rx="20" ry="19" fill="var(--fur)"/><ellipse cx="32" cy="46" rx="11" ry="8.5" fill="var(--fur-in)"/>
<circle cx="24.5" cy="34" r="3" fill="#17213B"/><circle cx="39.5" cy="34" r="3" fill="#17213B"/><circle cx="25.4" cy="33" r="1" fill="#FFFFFF"/><circle cx="40.4" cy="33" r="1" fill="#FFFFFF"/>
<ellipse cx="32" cy="42" rx="3.4" ry="2.4" fill="#17213B"/><path d="M27 47 Q32 51 37 47" stroke="#17213B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<rect x="22" y="18" width="20" height="4" rx="2" fill="var(--accent)"/></svg>`;
document.getElementById("logo").innerHTML = KIP.replace('class="face"','class="face" style="width:36px;height:36px"');
function kipSay(who, html, extra=""){ return `<div class="kip pop">${KIP}<div class="bubble"><div class="who">${who}</div>${html}${extra}</div></div>` }

/* =================== Thinking moves =================== */
const MOVES = {
 rewind:{n:"Rewind the movie",b:"RW",m:"End first. Undo every step: plus becomes minus, double becomes half.",
   s:"When Kip finds his popcorn bowl empty after a movie, he plays the movie backwards: put back the 4 he gave Mia, then the 6 he dropped, then double it back from when his brother took half.",
   q:"Did you think of starting at the END and walking backwards?"},
 seesaw:{n:"Seesaw swap",b:"SS",m:"Take the same thing off both sides and the seesaw stays level.",
   s:"Two kids balance on a seesaw, each holding the same backpack. Both drop their backpacks and it is still level. Scales, prices and weights work the same way.",
   q:"Did you think of putting two facts side by side and taking away what they share?"},
 portions:{n:"Pizza slices",b:"PZ",m:"Count the slices, not the pizzas. Birthdays come for everyone.",
   s:"Kip doesn't ask how many pizzas. He asks how many slices: 3 pizzas of 8 slices for 6 kids is 24 ÷ 6. Food for cats, seats on a bus, ages: count in one-for-one pieces. And every birthday, every person gets one year older.",
   q:"Did you think of counting in small single pieces, like 'one cat for one day'?"},
 odd:{n:"Odd socks",b:"OS",m:"Two odd socks make a pair: odd + odd = even. Odd + even stays odd.",
   s:"Kip's sock drawer: one odd sock and another odd sock make a pair. Lots of puzzles only care about odd or even, never the exact number. Bonus trick: add the digits, and if 3 divides the sum, 3 divides the number.",
   q:"Did you think of forgetting the exact numbers and only asking: odd or even? Or what's left over?"},
 columns:{n:"Ones first",b:"1s",m:"Ones first, then carry the extra bag upstairs.",
   s:"Kip carries grocery bags up the stairs one floor at a time. The ones floor first; anything extra gets carried up to the tens floor, then the hundreds.",
   q:"Did you think of lining the digits up in columns and starting with the ones?"},
 unlucky:{n:"Unlucky Ulysses",b:"UU",m:"Be unlucky first, then add one.",
   s:"Kip's cousin Ulysses is the unluckiest kangaroo alive. In the dark he grabs every wrong sock first. To be SURE, imagine Ulysses grabbing, and add one more.",
   q:"Did you think of the unluckiest thing that could happen first?"},
 squeeze:{n:"Squeeze the couch",b:"SQ",m:"To make one big, squeeze the others small. Then try to beat it.",
   s:"Four friends share a couch. For Kip to stretch out, everyone else squeezes as tight as they can. Then he checks: can I stretch even one more?",
   q:"Did you think of pushing everything else to its limit, then trying to do one better?"},
 pretend:{n:"Detective pretend",b:"DP",m:"Pretend it's true. Follow the trail. If the trail breaks, it was false.",
   s:"Detective Kip says, 'Suppose the butler did it.' Then he checks every clue. One clue doesn't fit? Then the butler didn't do it. Next suspect.",
   q:"Did you think of pretending one answer is true and checking every clue?"},
 lineup:{n:"Class photo",b:"CP",m:"Line them up in order: nobody hidden, nobody twice.",
   s:"For the class photo Kip lines kids up by height, so he counts everyone exactly once. Messy counting misses people or counts them twice.",
   q:"Did you think of making a neat, ordered list?"},
 rhythm:{n:"Find the beat",b:"FB",m:"Find the part that repeats, then count the beats.",
   s:"Songs repeat their chorus. Kip claps: 1, 2, 3, 4, 1, 2, 3, 4. Find the repeating chunk, then you can jump far ahead without writing everything.",
   q:"Did you think of making a table of the first few cases to see what repeats or grows?"},
 slide:{n:"Slide the stairs",b:"SL",m:"Slide the steps to the edge; the fence stays the same length. For area: cut it up, or cut it out.",
   s:"Kip walks a fence around a staircase-shaped garden. Every little step he takes sideways or up matches a piece of the big outside rectangle. Same length!",
   q:"Did you think of writing every length on the picture and sliding pieces around?"},
 flip:{n:"Fold it in your head",b:"FO",m:"Countdown 3-2-1-0: corners show 3 faces, edges 2, middles 1, inside 0. A mirror swaps left and right, never up and down.",
   s:"Kip flattens a cereal box and folds it back up. Nets, cubes, mirrors and folded paper all get easier when you move them slowly in your head, or with real paper.",
   q:"Did you think of folding, turning or unfolding it in your head, step by step?"},
 stack:{n:"Add it all up",b:"AA",m:"Add every total, then ask: who got counted twice?",
   s:"At Kip's party every kid counts their own handshakes. Adding them all up counts every handshake twice. Adding everything, then fixing the double counts, cracks many puzzles.",
   q:"Did you think of adding all the totals together and seeing what got counted more than once?"},
 tryit:{n:"Try it!",b:"TR",m:"Stuck? Try a small number, or test the answer choices.",
   s:"Kip doesn't know which key opens the door, so he tries them, smartly, most likely first. Plugging in a choice or a small example often shows the answer.",
   q:"Did you think of testing the answer choices, or trying it with a small number?"}
};
const MOVE_IDS = Object.keys(MOVES);
function moveCard(id, extra){ const M=MOVES[id]; return `<p><b>${M.q}</b></p><p>${M.s}</p><span class="mn">Remember: ${M.m}</span>${extra?`<p style="margin-top:8px">${extra}</p>`:""}` }

/* =================== Problem bank =================== */
const STAIR = `<svg class="fig" viewBox="-40 -14 230 168" width="300" role="img" aria-label="Staircase shape, bottom 8 cm, left side 6 cm, steps 2 cm">
<polygon points="0,120 160,120 160,80 120,80 120,40 80,40 80,0 0,0" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2.5"/>
<g font-family="Lexend, sans-serif" font-size="12" fill="var(--muted)"><text x="80" y="140" text-anchor="middle" font-size="13" fill="var(--ink)">8 cm</text>
<text x="-8" y="64" text-anchor="end" font-size="13" fill="var(--ink)">6 cm</text><text x="168" y="104">2</text><text x="140" y="74" text-anchor="middle">2</text>
<text x="128" y="64">2</text><text x="100" y="34" text-anchor="middle">2</text><text x="88" y="24">2</text></g></svg>`;

/* Kip's own practice problems: [id, move, level(1-3), type, text, options|null, answer, [h1,h2,h3], [why...]] */
const OWN = [
 ["o1","rewind",1,"num","Maya thinks of a number. She adds 7, then doubles the result, and gets 30. What number did she think of?",null,"8",["Which number do you actually know: the one at the start or the one at the end?","The last thing Maya did was double. What number doubles to make 30?","Before doubling it was 15. What number plus 7 makes 15?"],["Undo each step from the end: 30 halved is 15, and 15 − 7 = 8.","Check forwards: 8 + 7 = 15, 15 × 2 = 30."]],
 ["o2","rewind",2,"num","Leo had some stickers. He gave half of them to his sister. Then he gave 4 to his friend. Now he has 10 left. How many stickers did Leo have at the start?",null,"28",["Draw the chain: start → give half → give 4 → 10. Which end do you know?","Just before he gave his friend 4, how many did he have?","He had 14 before giving 4 away. If 14 is half, what did he start with?"],["Undo from the end: 10 + 4 = 14, and 14 is half, so 28.","Check: half of 28 is 14, minus 4 is 10."]],
 ["o3","rewind",3,"num","A magic purse doubles the coins inside it every time Tom opens it. But each time he opens it, he must then pay 8 coins to a troll. Tom opens it 3 times, and now the purse is empty. How many coins were in it at the start?",null,"7",["One opening is two steps: double, then pay 8. What is in the purse at the very end?","Undo the last opening: before paying there were 8 coins, so before doubling there were how many?","Before the last opening there were 4. Undo again: add 8, then halve. Once more."],["Undo 'double, then pay 8' as 'add 8, then halve'.","0 → 8 → 4, then 4 → 12 → 6, then 6 → 14 → 7.","Check: 7 → 14 → 6 → 12 → 4 → 8 → 0."]],
 ["o4","seesaw",1,"num","3 apples and 1 melon weigh 1100 g. 1 apple and 1 melon weigh 700 g. How much does one apple weigh, in grams?",null,"200",["Put the two groups side by side. What is the same in both?","Both have one melon. Take it off both sides. What makes the difference now?","The difference is 2 apples, weighing 1100 − 700. So one apple weighs?"],["Take the melon off both: 2 apples = 400 g.","One apple = 200 g."]],
 ["o5","seesaw",2,"mc","A ball and a bat cost $11 together. Two balls and a bat cost $14. How much does the bat cost?",["$3","$5","$7","$8","$11"],"D",["What is different between the two groups?","The second group has one extra ball and costs $3 more. What does a ball cost?","A ball is $3 and ball + bat is $11. What's left for the bat?"],["The extra ball costs 14 − 11 = $3.","The bat costs 11 − 3 = $8."]],
 ["o6","seesaw",3,"num","On a balance, 2 cubes weigh the same as 3 balls. Also, 1 cube and 1 ball together weigh 50 g. How much does one ball weigh, in grams?",null,"20",["Can you make the second fact talk about 2 cubes as well?","Double it: 2 cubes and 2 balls weigh 100 g. Now what can you swap?","Swap the 2 cubes for 3 balls. How many balls weigh 100 g?"],["Doubled: 2 cubes + 2 balls = 100 g.","Swap 2 cubes for 3 balls: 5 balls = 100 g, so a ball is 20 g."]],
 ["o7","portions",1,"mc","Grandpa has enough birdseed to feed 6 birds for 10 days. Then 4 more birds join. Every bird eats the same amount each day. How many days will the seed last now?",["4","5","6","8","10"],"C",["Measure the seed in 'one bird for one day' meals. How many meals?","6 birds × 10 days = 60 meals. How many birds are eating now?","60 meals, 10 birds a day. How many days?"],["The seed is 60 bird-meals.","10 birds eat 10 a day, so 6 days."]],
 ["o8","portions",2,"num","Right now the ages of three sisters add up to 20. In how many years will their ages add up to 41?",null,"7",["After one year, how much bigger is the total?","Each year the total grows by 3. How much must it grow?","It must grow by 21. How many years of +3?"],["Every year each sister gains 1, so the total gains 3.","41 − 20 = 21, and 21 ÷ 3 = 7."]],
 ["o9","portions",3,"num","Mom is 34. Her two children are 5 and 3. In how many years will Mom's age equal her children's ages added together?",null,"26",["How far apart are Mom's age and the children's total right now?","Each year Mom gains 1. How much do the two children gain together? So how does the gap change?","The gap is 26 and shrinks by 1 a year."],["Now: 34 against 5 + 3 = 8, a gap of 26.","Mom +1, children +2, so the gap shrinks by 1 a year: 26 years (60 = 31 + 29)."]],
 ["o10","odd",1,"mc","Sam adds three odd numbers. Which of these could be his answer?",["20","28","33","40","50"],"C",["Try 1 + 3 + 5. Odd or even?","Odd + odd is even. Even + odd is?","Three odd numbers always make an odd number."],["Odd + odd = even, even + odd = odd.","Only 33 is odd."]],
 ["o11","odd",2,"num","Ana writes the numbers 1 to 20. She circles every even number and also every multiple of 3. How many numbers are circled?",null,"13",["How many even numbers? How many multiples of 3?","Some numbers are in both groups. Did you count them twice?","10 even, 6 multiples of 3, and 6, 12, 18 are in both."],["10 + 6 counts 6, 12 and 18 twice.","10 + 6 − 3 = 13."]],
 ["o12","odd",3,"num","In a row of 6 boxes, every box after the second holds the sum of the two boxes before it (like 1, 2, 3, 5, 8, 13). The first two numbers are both odd. How many of the 6 numbers are odd?",null,"4",["Do you need the real numbers? Write O for odd and E for even.","O + O is what?","O, O, E, ... keep going and count the O's."],["O O → E, then O, O, E.","O O E O O E: 4 odd numbers, always."]],
 ["o13","columns",1,"num","In the sum  ▢6 + 4▢ = 93,  each box hides a digit. What is the sum of the two hidden digits?",null,"11",["What do they want: the digits, or the digits added?","Ones column: 6 + ▢ must end in 3. Which digit?","It's 7, carry 1. Tens: ▢ + 4 + 1 = 9."],["Ones: 6 + 7 = 13, carry 1. Tens: 4 + 4 + 1 = 9.","46 + 47 = 93, and 4 + 7 = 11."]],
 ["o14","columns",2,"mc","Each letter is a digit, and different letters are different digits. A + A + A = BA, where BA is a two-digit number with tens digit B and ones digit A. What is A?",["0","2","4","5","8"],"D",["Try the choices: what is A + A + A for each?","The answer must end in A. Which digit times 3 ends in itself?","Try 5: 5 + 5 + 5 = 15."],["3 × A must end in A: only 0 or 5.","0 gives no two-digit number; 5 gives 15, so A = 5."]],
 ["o15","columns",3,"num","In the subtraction  ▢3▢ − 1▢7 = 285,  three digits are hidden. What is the sum of the three hidden digits?",null,"10",["Turn it around: ▢3▢ = 285 + 1▢7. Is adding easier?","Ones: 5 + 7. What digit, and what do you carry?","Tens: 8 + ▢ + 1 must end in 3. Then the hundreds."],["285 + 147 = 432: ones 12 (carry), tens 13 (carry), hundreds 4.","Hidden digits 4, 4, 2: sum 10."]],
 ["o16","unlucky",1,"mc","A drawer has 5 red socks and 5 blue socks. It is dark. How many socks must you take to be sure you have two of the same colour?",["2","3","5","6","10"],"B",["Be Ulysses: after 2 socks, could they be different?","One red, one blue. What colour can the third be?","The third always matches one."],["Unluckiest: red, blue.","The third sock must match: 3."]],
 ["o17","unlucky",2,"num","A bag has 4 red, 6 green and 9 yellow marbles. Without looking, how many must you take out to be sure of getting at least one green?",null,"14",["Which marbles would unlucky Ulysses keep pulling out?","He could pull every non-green marble first. How many?","4 red + 9 yellow = 13. Then?"],["All 13 non-green could come first.","The 14th must be green."]],
 ["o18","unlucky",3,"num","A class has 25 students. At least how many of them must share the same birth month?",null,"3",["Spread the birthdays out as much as possible. How many months?","1 student per month, then 1 more per month. How many placed?","24 placed with 2 per month. Where does number 25 go?"],["2 per month covers 24 students.","The 25th makes some month have 3."]],
 ["o19","squeeze",1,"num","Four friends each caught a different number of fish, 22 in total. Ben caught the most. What is the smallest number Ben could have caught?",null,"7",["To keep Ben small, should the others be big or small?","Try Ben = 6. The others are different and below 6. Most they can catch?","5 + 4 + 3 = 12, total 18. Too few. Try 7."],["Ben 6 gives at most 18.","Ben 7: 6 + 5 + 4 + 7 = 22. So 7."]],
 ["o20","squeeze",2,"mc","Use each of the digits 2, 5, 7 and 9 once to make two 2-digit numbers. What is the smallest possible sum?",["86","95","104","113","129"],"A",["Which place matters more: tens or ones?","Smallest digits where they count most. Which go in the tens?","Tens 2 and 5, ones 7 and 9: 27 + 59."],["Tens count 10 times, so 2 and 5 go there.","27 + 59 = 86."]],
 ["o21","squeeze",3,"num","Nine baskets stand in a row. Each has at least 1 apple. Any two neighbouring baskets hold at most 7 apples together. What is the largest number of apples there can be?",null,"34",["If one basket is very full, what about its neighbours?","A basket of 6 forces neighbours of 1. Try 6, 1, 6, 1, ...","With 9 baskets, put the 6s at both ends. Count."],["Alternate big and small: 6, 1, 6, 1, 6, 1, 6, 1, 6.","5 × 6 + 4 × 1 = 34."]],
 ["o22","pretend",1,"mc","One of Amy, Ben and Cal ate the last cookie. Exactly one of them tells the truth. Amy: “Ben ate it.” Ben: “I did not eat it.” Cal: “I did not eat it.” Who ate it?",["Amy","Ben","Cal","Nobody","Can't tell"],"C",["Pretend each person ate it. Count the true sentences.","If Amy ate it, whose sentences are true?","Exactly one true sentence. Try Cal."],["Amy or Ben as eater gives two true sentences.","Cal as eater: only Ben is truthful. It fits."]],
 ["o23","pretend",2,"mc","Knights always tell the truth; knaves always lie. P says: “We are both knaves.” What are P and Q?",["Both knights","Both knaves","P knight, Q knave","P knave, Q knight","Can't tell"],"D",["Could a knight say 'I am a knave'?","So P is a knave and the sentence is a lie. What is NOT true?","They are not both knaves, but P is. So Q is?"],["A knight never says he's a knave, so P is a knave.","The lie means not both knaves: Q is a knight."]],
 ["o24","pretend",3,"num","Five sentences are on a board, and exactly one is true. (1) Exactly one sentence here is false. (2) Exactly two are false. (3) Exactly three are false. (4) Exactly four are false. (5) All five are false. Which sentence is true? Type its number.",null,"4",["The question already tells you how many are true. So how many are false?","Exactly one true means exactly how many false?","Four false. Which sentence says that?"],["One true means four false.","Sentence 4 says exactly that."]],

 ["o26","lineup",2,"mc","Lily has 3 shirts and 4 pairs of shorts. An outfit is one shirt and one pair of shorts. How many different outfits?",["7","10","12","16","24"],"C",["Pick one shirt. How many outfits with just that shirt?","Each shirt goes with 4 shorts. How many shirts?","3 shirts × 4 each."],["Every shirt with every pair of shorts.","3 × 4 = 12."]],
 ["o27","stack",3,"num","Six friends meet, and every friend shakes hands once with every other friend. How many handshakes are there?",null,"15",["How many hands does each friend shake?","6 × 5 = 30. But one handshake between Ana and Bo: how many times did you count it?","Each handshake was counted twice."],["Each friend shakes 5 hands: 30 counts.","Each handshake counted twice: 15."]],
 ["o28","rhythm",1,"num","Toothpick squares in a row: 1 square uses 4 toothpicks, 2 squares use 7, 3 squares use 10. How many toothpicks for 10 squares in a row?",null,"31",["Make a table: squares and toothpicks.","How many does each new square add?","4 for the first, then +3 nine times."],["Each new square shares a side: +3.","4 + 9 × 3 = 31."]],
 ["o29","rhythm",2,"mc","Today is Monday. What day of the week will it be 100 days from today?",["Monday","Tuesday","Wednesday","Thursday","Saturday"],"C",["After 7 days, what day is it?","How many full weeks fit in 100 days, and how many days are left?","14 weeks and 2 days. 2 days after Monday?"],["Every 7 days is Monday again; 98 days is 14 weeks.","2 more days: Wednesday."]],
 ["o30","rhythm",3,"num","Kai writes 1, 2, 3, 2, 1, 2, 3, 2, 1, ... and keeps going. What is the sum of the first 50 numbers?",null,"99",["Find the repeating part. How long is it and what's its sum?","1, 2, 3, 2 repeats: 4 numbers, sum 8. How many full blocks in 50?","12 blocks use 48 numbers. The 49th and 50th are?"],["12 blocks: 96.","Then 1 + 2: 99."]],
 ["o31","slide",1,"mc","A rectangle has area 24 cm² and whole-number sides. Which can NOT be its perimeter?",["20 cm","22 cm","28 cm","50 cm","24 cm"],"E",["Circle NOT. List every rectangle with area 24.","1×24, 2×12, 3×8, 4×6. Perimeter of each?","Perimeter = 2 × (length + width). Which choice never shows up?"],["Perimeters: 50, 28, 22, 20.","24 never appears."]],
 ["o32","slide",2,"num","A 10 cm square is cut into two rectangles with one straight cut. One rectangle has perimeter 26 cm. What is the perimeter of the other, in cm?",null,"34",["Draw it. Both pieces are 10 cm long. What differs?","2 × (10 + width) = 26. Width?","3 cm wide, so the other is 7 cm wide."],["First piece 10 × 3.","Other piece 10 × 7: perimeter 34."]],

function deviceId(){ let d=lsGet("kmg_device",null); if(!d){ d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^a-zA-Z0-9-]/g,""); lsSet("kmg_device",d) } return d }
function makeApiDb(dev){
  const q="?d="+encodeURIComponent(dev);
  const doc=(col,id)=>({id,
    async get(){ const r=await fetch(`/api/d/${col}/${id}${q}`); if(r.status===404) return {exists:false,id,data:()=>undefined}; if(!r.ok) throw new Error("load"); const j=await r.json(); return {exists:true,id,data:()=>j} },
    async set(b){ const r=await fetch(`/api/d/${col}/${id}${q}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error("save") }});
  return { doc:p=>{const[c,i]=p.split("/"); return doc(c,i)},
    collection:c=>({ doc:id=>doc(c,id||(crypto.randomUUID?crypto.randomUUID():String(Date.now()))),
      async get(){ const r=await fetch(`/api/c/${c}${q}`); if(!r.ok) throw new Error("load"); const j=await r.json(); return {docs:j.map(x=>({id:x.id,data:()=>x.data}))} } }) };
}
async function initDb(){
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(e){ db=null }
  if(!db && /^https?:$/.test(location.protocol)){ try{ const h=await fetch("/api/health"); if(h.ok) db=makeApiDb(deviceId()) }catch(e){} }
  if(!db) return;
  try{
    const [a,t,s,ln]=await Promise.all([db.collection("attempts").get(),db.collection("tests").get(),db.doc("app/state").get(),db.doc("app/learner").get()]);
    if(ln.exists){ const rl=ln.data(); if(!learner || (rl.updated||"")>=(learner.updated||"")) learner=rl; else await db.doc("app/learner").set(learner) } else if(learner) await db.doc("app/learner").set(learner);
    lsSet("kmg_learner",learner);
    const remote=a.docs.map(d=>({...d.data(),_id:d.id})); const keys=new Set(remote.map(r=>r.key));
    const pending=attempts.filter(x=>!keys.has(x.key));
    attempts=[...remote,...pending].sort((x,y)=>x.at.localeCompare(y.at));
    const rt=t.docs.map(d=>({...d.data(),_id:d.id})); const tk=new Set(rt.map(r=>r.key)); const tp=tests.filter(x=>!tk.has(x.key));
    tests=[...rt,...tp].sort((x,y)=>x.at.localeCompare(y.at));
    if(s.exists){ const rs=s.data(); if(!state.updated || (rs.updated||"")>=state.updated) state=rs; else await db.doc("app/state").set(state) } else await db.doc("app/state").set(state);
    saveNote="Saved to this page";
    for(const p of pending) await pushAttempt(p);
    for(const t of tp) await pushTest(t);
    lsSet("kmg_attempts",attempts); lsSet("kmg_tests",tests); lsSet("kmg_state",state);
    if(!view.pid && !view.run) render();
  }catch(e){ db=null }
}
async function pushAttempt(a){ if(!db) return; try{ const {_id,...b}=a; const ref=_id?db.doc("attempts/"+_id):db.collection("attempts").doc(); await ref.set(b); a._id=ref.id }catch(e){} }
async function pushTest(t){ if(!db) return; try{ const {_id,...b}=t; const ref=_id?db.doc("tests/"+_id):db.collection("tests").doc(); await ref.set(b); t._id=ref.id }catch(e){} }
async function saveAttempt(a){ if(!attempts.includes(a)) attempts.push(a); lsSet("kmg_attempts",attempts); await pushAttempt(a); lsSet("kmg_attempts",attempts) }
async function saveState(){ state.updated=new Date().toISOString(); lsSet("kmg_state",state); if(db){ try{ await db.doc("app/state").set(state) }catch(e){} } }
async function saveTest(t){ tests.push(t); lsSet("kmg_tests",tests); await pushTest(t); lsSet("kmg_tests",tests) }

/* =================== Helpers =================== */
const today=()=>{const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10)};
const fmt=s=>{const neg=s<0; s=Math.abs(Math.round(s)); return (neg?"+":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=v=>String(v).trim().toLowerCase().replace(/[\s$,]/g,"").replace(/(cm²|m²|cm|kg|km\/h|km|mg|g|m|days?|years?|weeks?|gb|litres?|l|cents?|°)$/,"");
function numVal(v){ v=norm(v); if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(v)){const[a,b]=v.split("/").map(Number);return b?a/b:NaN} return v===""?NaN:Number(v) }
const normT=v=>String(v).toLowerCase().replace(/\s|p\.?m\.?|a\.?m\.?/g,"");
function isRight(p,v){ if(p.type==="mc") return v===p.ans; if(p.type==="text") return normT(v)===normT(p.ans); const a=numVal(v),b=numVal(p.ans); return !isNaN(a)&&Math.abs(a-b)<=(p.tol||1e-9) }
const practice=()=>attempts.filter(a=>a.mode!=="test");
const latest=pid=>{const xs=practice().filter(a=>a.pid===pid); return xs[xs.length-1]};
const isClean=a=>a&&a.correct&&a.hints===0&&!a.over;
function dueOn(a){ if(!a) return null; if(a.revealed) return addDays(a.at.slice(0,10),1); if(a.hints>=1||a.over) return addDays(a.at.slice(0,10),3); return null }
function srcLabel(p){ return p.src==="learn"?`${p.g===0?"Kindergarten":"Grade "+p.g} · ${p.title} · Real life: ${p.life}`:p.src==="book"?`${p.year} · problem ${p.n}`:p.src==="sample"?`Sample test · question ${p.n}`:`Kip's puzzle · ${MOVES[p.move].n}` }
function rng(seed){ let h=2166136261; for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)} return ()=>{h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296} }

/* =================== Daily plan =================== */
function buildPlan(){
  const d=today(); if(state.plans[d]) return state.plans[d];
  const L=LEVELS[state.level-1], R=rng(d+state.level);
  const due=POOL.filter(p=>{const a=latest(p.id); const dd=dueOn(a); return dd && dd<=d}).slice(0,2);
  const seen=new Set(practice().map(a=>a.pid));
  const moveCount={}; practice().forEach(a=>{const p=byId[a.pid]; if(p) moveCount[p.move]=(moveCount[p.move]||0)+1});
  const chosen=[...due];
  while(chosen.length<L.n){
    const r=R(); const pts = r<L.mix[0]?3: r<L.mix[0]+L.mix[1]?4:5;
    const used=new Set(chosen.map(p=>p.move));
    let cands=POOL.filter(p=>!seen.has(p.id)&&!chosen.includes(p)&&p.pts===pts);
    if(!cands.length) cands=POOL.filter(p=>!seen.has(p.id)&&!chosen.includes(p));
    if(!cands.length) cands=POOL.filter(p=>!chosen.includes(p));
    const fresh=cands.filter(p=>!used.has(p.move)); const pick=(fresh.length?fresh:cands);
    // prefer moves practised least, then Kip's own puzzles early on
    pick.sort((a,b)=>((moveCount[a.move]||0)-(moveCount[b.move]||0)) || ((a.src==="own"?0:1)-(b.src==="own"?0:1)) || (R()-.5));
    chosen.push(pick[0]);
  }
  // interleave: no two same moves in a row
  for(let i=1;i<chosen.length;i++){ if(chosen[i].move===chosen[i-1].move){ const j=chosen.findIndex((p,k)=>k>i&&p.move!==chosen[i-1].move); if(j>0)[chosen[i],chosen[j]]=[chosen[j],chosen[i]] } }
  state.plans[d]={ids:chosen.map(p=>p.id), level:state.level};
  const keys=Object.keys(state.plans).sort(); while(keys.length>60) delete state.plans[keys.shift()];
  saveState(); return state.plans[d];
}
function planResults(d){ const plan=state.plans[d]; if(!plan) return null;
  const res=plan.ids.map(id=>{const xs=practice().filter(a=>a.pid===id&&a.at.slice(0,10)===d); return xs[0]||null});
  return {plan,res,done:res.every(Boolean),clean:res.filter(isClean).length,shown:res.filter(a=>a&&a.revealed).length} }
async function closeDay(){
  const d=today(); const pr=planResults(d); if(!pr||!pr.done) return null;
  if(state.history.some(h=>h.date===d)) return state.history.find(h=>h.date===d);
  const rate=pr.clean/pr.plan.ids.length; let lvl=state.level, change=0;
  if(rate>=0.75 && pr.shown===0 && lvl<5){lvl++;change=1} else if(rate<0.4 && lvl>1){lvl--;change=-1}
  const h={date:d,level:state.level,next:lvl,clean:pr.clean,total:pr.plan.ids.length,shown:pr.shown,change};
  state.history.push(h); state.level=lvl; await saveState(); return h;
}

/* =================== Views =================== */
const app=document.getElementById("app"); let view={tab:"today"}, timerId=null;
function go(v){ clearInterval(timerId); view=v; render(); window.scrollTo(0,0) }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go({tab:b.dataset.tab}));
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===view.tab&&!view.pid&&!view.run?"page":"false"));
  if(view.pid) return renderProblem(); if(view.run) return renderTest();
  if(view.place) return renderPlacement();
  ({today:renderToday,learn:renderLearn,moves:renderMoves,test:renderTests,coach:renderCoach})[view.tab]();
}
const levelBar=l=>`<span class="level" aria-label="Level ${l} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=l?"on":""}"></i>`).join("")}</span>`;

function renderToday(){
  const first=practice().length===0;
  const plan=buildPlan(); const pr=planResults(today());
  const L=LEVELS[plan.level-1];
  const dots=plan.ids.map((id,i)=>{const a=pr.res[i]; return `<span class="dot ${!a?"":a.revealed?"shown":isClean(a)?"clean":"helped"}" title="Problem ${i+1}"></span>`}).join("");
  const nextIdx=pr.res.findIndex(a=>!a);
  const avg=Math.round(plan.ids.reduce((s,id)=>s+limitFor(byId[id],plan.level),0)/plan.ids.length);
  let body;
  if(first){
    body = kipSay("Hi, I'm Kip!", `<p>I'm a kangaroo who loves puzzles. Every day we'll do a few together. Here's my secret: before solving, I <b>SPOT</b> the problem.</p>
      <p style="margin-top:6px"><b>S</b>ay what they want. <b>P</b>redict: guess, and cross out what can't be. <b>O</b>ne move: pick a trick from my moves. <b>T</b>est: does your answer fit every sentence?</p>`,
      `<span class="mn">Remember: Let's SPOT it!</span>`);
  } else if(pr.done){
    const h=state.history.find(x=>x.date===today());
    const msg = h? (h.change>0?`Amazing! ${h.clean} of ${h.total} solved on your own and in time. Tomorrow you go up to level ${h.next}: one more problem, a bit less time.`:
      h.change<0?`Today was hard, and hard is how brains grow. Tomorrow we'll slow down a little, and your coach will look at the tricky ones with you.`:
      `${h.clean} of ${h.total} solved on your own and in time. Same level tomorrow, and the tricky ones come back for another try.`):"Done for today!";
    body = kipSay("Today is done", `<p>${msg}</p>`);
  } else {
    body = kipSay(nextIdx===0?"Ready?":"Keep going!", `<p>${nextIdx===0?`Today: <b>${plan.ids.length} problems</b>, about <b>${fmt(avg)}</b> each. Guess first, cross out what can't be, then solve on paper.`:`You've done ${nextIdx} of ${plan.ids.length}. Next one coming up.`}</p>`);
  }
  app.innerHTML=`<div class="stack">
    ${body}
    <div class="card stack">
      <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Today's set</div><div class="dots" style="margin-top:6px">${dots}</div></div><div style="text-align:right"><div class="eyebrow">Level ${plan.level}</div>${levelBar(plan.level)}</div></div>
      ${pr.done?`<div class="row"><button class="btn ghost" id="review">See today's problems</button><button class="btn soft" id="extra">One bonus Kip puzzle</button></div>`:`<div><button class="btn" id="go">${nextIdx===0?"Start":"Continue"} →</button></div>`}
    </div>
    <div class="spot"><div><b><span>S</span>ay</b>What do they want?</div><div><b><span>P</span>redict</b>Guess. Cross out the impossible.</div><div><b><span>O</span>ne move</b>Which trick fits?</div><div><b><span>T</span>est</b>Fits every sentence?</div></div>
  </div>`;
  const go1=app.querySelector("#go"); if(go1) go1.onclick=()=>go({tab:"today",pid:plan.ids[nextIdx],list:plan.ids,daily:true});
  const rv=app.querySelector("#review"); if(rv) rv.onclick=()=>{ app.querySelector(".card").insertAdjacentHTML("afterend",`<div class="list">${plan.ids.map(id=>item(byId[id])).join("")}</div>`); bindOpen(plan.ids); rv.remove() };
  const ex=app.querySelector("#extra"); if(ex) ex.onclick=()=>{ const p=OWN.find(q=>!latest(q.id))||POOL.find(q=>!latest(q.id)); if(p) go({tab:"today",pid:p.id,list:[p.id]}) };
}
function item(p){ const a=latest(p.id);
  const chip=!a?'<span class="chip plain">New</span>':a.revealed?'<span class="chip bad">Try again soon</span>':isClean(a)?'<span class="chip good">Solved alone</span>':'<span class="chip">Solved with help</span>';
  return `<button class="item" data-open="${p.id}"><span class="l"><span class="small muted">${srcLabel(p)}</span><br>${p.src==="own"?esc(p.text.slice(0,64))+"…":MOVES[p.move].n}</span>${chip}</button>` }
function bindOpen(list){ app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go({tab:view.tab,pid:b.dataset.open,list})) }

function renderMoves(){
  const cnt={}; practice().forEach(a=>{const p=byId[a.pid]; if(!p) return; cnt[p.move]=cnt[p.move]||{t:0,c:0}; cnt[p.move].t++; if(isClean(a)) cnt[p.move].c++});
  app.innerHTML=`<div class="stack">${kipSay("My 14 moves", `<p>Every hard puzzle gets easier with the right move. Read the stories, they help you remember. When you're stuck, ask: <b>which move would make this easy?</b></p>`)}
  <div class="mgrid">${MOVE_IDS.map(id=>{const M=MOVES[id]; const c=cnt[id];
   return `<div class="move"><div class="row"><span class="badge">${M.b}</span><span class="t">${M.n}</span></div><p class="m">${M.m}</p><p class="small muted">${M.s}</p>${c?`<span class="small muted">Solved alone ${c.c} of ${c.t}</span>`:""}<div><button class="btn ghost" data-try="${id}" style="padding:6px 12px;font-size:14px">Practise this move</button></div></div>`}).join("")}</div></div>`;
  app.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{ const ps=POOL.filter(p=>p.move===b.dataset.try).sort((x,y)=>(!!latest(x.id))-(!!latest(y.id))||x.pts-y.pts).slice(0,4); go({tab:"moves",pid:ps[0].id,list:ps.map(p=>p.id)}) });
}

/* ---------- problem screen ---------- */
function renderProblem(){
  const p=byId[view.pid]; const lvl=state.plans[today()]?.level||state.level; const limit=limitFor(p,lvl);
  const st={start:Date.now(),paused:0,pauseAt:null,guess:null,tries:0,hints:0,crossed:[],wrong:[],done:false,revealed:false,over:false};
  const list=view.list||[]; const idx=list.indexOf(p.id); const nextId=idx>=0&&idx<list.length-1?list[idx+1]:null;
  app.innerHTML=`<div class="stack">
    <div class="ptop"><button class="btn ghost" id="back">← Back</button>${list.length>1?`<span class="chip plain">${idx+1} of ${list.length}</span>`:""}<span class="chip blue">${p.pts} points</span>
      <span class="row" style="gap:6px"><span class="timer" id="timer" aria-live="off">${fmt(limit)}</span><button class="btn ghost" id="pause" style="padding:6px 10px">Pause</button></span></div>
    <div class="card stack">
      <div class="small muted">${srcLabel(p)}</div>
      ${p.src==="own"?`<div class="ptext">${esc(p.text)}</div>${p.fig}`:`<div class="book">${esc(p.text)}</div>`}
    </div>
    <div class="spot"><div><b><span>S</span>ay</b>What do they want?</div><div><b><span>P</span>redict</b>${p.type==="mc"?"Tap ✕ on choices that can't be":"Guess before you work"}</div><div><b><span>O</span>ne move</b>Which trick fits?</div><div><b><span>T</span>est</b>Fits every sentence?</div></div>
    ${p.type==="num"?`<div class="card stack" id="guessCard"><div class="eyebrow">Predict · your guess</div><div class="row"><input id="guess" class="num" style="width:150px" placeholder="Guess" autocomplete="off"><button class="btn dark" id="lock">Lock it in</button><button class="btn ghost" id="skip">Skip</button></div></div>`:""}
    <div class="card stack" id="ansCard" ${p.type==="num"?"hidden":""}><div class="eyebrow">Your answer</div><div id="area"></div>
      <div class="row"><button class="btn soft" id="stuck">I'm stuck</button><span class="small muted">Kip will ask you a question, not tell you the answer.</span></div></div>
    <div class="stack" id="hints"></div><div id="result"></div></div>`;
  const tEl=app.querySelector("#timer");
  const elapsed=()=>((st.pauseAt||Date.now())-st.start-st.paused)/1000;
  timerId=setInterval(()=>{ if(st.done||st.pauseAt) return; const left=limit-elapsed(); tEl.textContent=fmt(left); tEl.classList.toggle("low",left<=20&&left>0); tEl.classList.toggle("over",left<=0);
    if(left<=0&&!st.over){ st.over=true; app.querySelector("#hints").insertAdjacentHTML("beforeend",kipSay("Time!",`<p>In the real test you would move on now. Here, keep thinking and finish it. Speed comes from practice.</p>`)) } },500);
  app.querySelector("#pause").onclick=e=>{ if(st.done) return; if(st.pauseAt){ st.paused+=Date.now()-st.pauseAt; st.pauseAt=null; e.target.textContent="Pause" } else { st.pauseAt=Date.now(); e.target.textContent="Resume" } };
  app.querySelector("#back").onclick=()=>go({tab:view.tab});
  if(p.type==="num"){
    const start=()=>{ app.querySelector("#guessCard").innerHTML=`<div class="eyebrow">Predict</div><div>${st.guess!==null?`Your guess: <b style="font-family:var(--mono)">${esc(st.guess)}</b>`:"No guess this time."}</div>`; app.querySelector("#ansCard").hidden=false; draw() };
    app.querySelector("#lock").onclick=()=>{ st.guess=app.querySelector("#guess").value.trim()||null; start() };
    app.querySelector("#guess").onkeydown=e=>{ if(e.key==="Enter") app.querySelector("#lock").click() };
    app.querySelector("#skip").onclick=start;
  } else draw();
  app.querySelector("#stuck").onclick=()=>{ if(st.done) return; if(st.hints<3){ st.hints++; drawHints() } else offerReveal() };

  function draw(){ const area=app.querySelector("#area");
    if(p.type==="mc"){
      area.innerHTML=`<div class="opts">${p.opts.map((o,i)=>{const k="ABCDE"[i]; const lbl=p.src==="own"?`<span class="k">${k}</span>${esc(o)}`:`<span class="k">${k}</span>`;
        const cls=st.wrong.includes(k)?"wrong":st.done&&k===p.ans?"right":st.crossed.includes(k)?"x":"";
        return `<div class="optw"><button class="opt ${cls}" data-k="${k}" ${st.wrong.includes(k)||st.done?"disabled":""}>${lbl}</button>${st.done||st.wrong.includes(k)?"":`<button class="xbtn" data-x="${k}" aria-pressed="${st.crossed.includes(k)}" aria-label="Cross out ${k}">✕</button>`}</div>`}).join("")}</div>`;
      area.querySelectorAll(".opt").forEach(b=>b.onclick=()=>submit(b.dataset.k,b));
      area.querySelectorAll(".xbtn").forEach(b=>b.onclick=()=>{ const k=b.dataset.x; st.crossed=st.crossed.includes(k)?st.crossed.filter(x=>x!==k):[...st.crossed,k]; draw() });
    } else {
      area.innerHTML=`<div class="row"><input id="ans" class="num" placeholder="Answer" autocomplete="off"><button class="btn" id="check">Check</button></div>`;
      const inp=area.querySelector("#ans"); area.querySelector("#check").onclick=()=>submit(inp.value,inp); inp.onkeydown=e=>{if(e.key==="Enter")submit(inp.value,inp)}; inp.focus();
    } }
  function submit(v,el){ if(st.done) return; if(p.type==="num"&&String(v).trim()===""){el.focus();return}
    st.tries++; if(isRight(p,v)) return finish(true,v);
    if(p.type==="mc"){ st.wrong.push(v); if(st.crossed.includes(p.ans)) st.crossed=st.crossed.filter(x=>x!==p.ans); draw() } else { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); el.select() }
    if(st.hints<3){ st.hints++; drawHints() } else offerReveal() }
  function hintHtml(i){
    if(i===1){ const extra=p.hints[1]; return kipSay(`Kip's move · ${MOVES[p.move].n}`, moveCard(p.move, extra||"")) }
    const who = i===0?"Kip asks":"Kip leans closer";
    return kipSay(who,`<p>${esc(p.hints[i])}</p>`);
  }
  function drawHints(){ const h=app.querySelector("#hints"); const keep=[...h.querySelectorAll(".timeup")];
    h.innerHTML=[0,1,2].slice(0,st.hints).map(hintHtml).join("")+(st.hints===3?`<p class="small muted">That was Kip's last hint. Give it one more go!</p>`:"");
    h.lastElementChild.scrollIntoView({behavior:"smooth",block:"nearest"}) }
  function offerReveal(){ const r=app.querySelector("#result"); if(r.querySelector("#reveal")) return;
    r.innerHTML=`<div class="result bad stack"><h3>Still not it. That's fine: struggling is how your brain grows.</h3><p>Want to see Kip's way? This one will come back in a day or two for you to try alone.</p><div><button class="btn" id="reveal">Show me Kip's way</button></div></div>`;
    r.querySelector("#reveal").onclick=()=>{ st.revealed=true; finish(false,null) } }
  async function finish(correct,v){
    st.done=true; clearInterval(timerId); const secs=Math.round(elapsed()); if(secs>limit) st.over=true;
    const a={key:p.id+"-"+Date.now(),pid:p.id,move:p.move,src:p.src,pts:p.pts,mode:view.daily?"daily":"practice",correct,tries:st.tries,hints:st.hints,revealed:st.revealed,over:st.over,limit,secs,guess:st.guess,crossed:st.crossed.length,answer:v,usedMove:null,at:new Date().toISOString()};
    if(p.type==="mc") draw(); else { const i=app.querySelector("#ans"); if(i) i.disabled=true }
    const clean=correct&&st.hints===0&&!st.over;
    const title = !correct ? "Here's how Kip sees it" : clean ? "Yes! On your own and in time." : st.hints===0 ? "Yes! Now let's get faster." : "Yes! You got there.";
    const ans = p.type==="mc" ? ((p.src==="own"||p.src==="learn")?`${p.ans} (${esc(p.opts["ABCDE".indexOf(p.ans)])})`:p.ans) : esc(p.show||p.ans);
    const g = st.guess!==null ? `<p>Your guess was <b>${esc(st.guess)}</b>.${!isNaN(numVal(st.guess))?(isRight(p,st.guess)?" Spot on!":" Was it close? What would have made it closer?"):""}</p>`:"";
    const r=app.querySelector("#result");
    r.innerHTML=`<div class="result ${correct?"good":"bad"} stack pop">
      <div><h3>${title}</h3><p>Answer <b style="font-family:var(--mono)">${ans}</b> · ${fmt(secs)} of ${fmt(limit)}${st.hints?` · ${st.hints} hint${st.hints>1?"s":""}`:""}</p>${g}</div>
      ${correct?`<div class="stack" style="gap:8px"><div class="eyebrow">Which move did you use?</div><div class="picks">${MOVE_IDS.map(id=>`<button class="pick" data-m="${id}" aria-pressed="false">${MOVES[id].n}</button>`).join("")}<button class="pick" data-m="none" aria-pressed="false">Just saw it</button></div><div id="mvNote" class="small"></div></div>`:""}
      <div class="why"><div class="eyebrow">Kip's way · ${MOVES[p.move].n}</div>${p.why.map(w=>`<p>${esc(w)}</p>`).join("")}${(p.src==="book"||p.src==="sample")?`<p class="small muted">The full worked solution is in your solutions book${p.src==="book"?` (Year ${p.year}, problem ${p.n})`:""}. Explain it back to your coach in your own words.</p>`:""}</div>
      <div class="row">${nextId?`<button class="btn" id="next">Next problem →</button>`:""}<button class="btn ghost" id="done">${view.daily&&!nextId?"Finish today":"Done"}</button><span class="small muted">${saveNote}</span></div></div>`;
    r.querySelectorAll(".pick").forEach(b=>b.onclick=async()=>{ r.querySelectorAll(".pick").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); a.usedMove=b.dataset.m;
      r.querySelector("#mvNote").textContent = b.dataset.m===p.move?`Kip used ${MOVES[p.move].n} too!`:b.dataset.m==="none"?`Nice! Kip calls this one ${MOVES[p.move].n}.`:`Your way worked! Kip's way was ${MOVES[p.move].n}. Two moves are better than one.`;
      await saveAttempt(a) });
    if(nextId) r.querySelector("#next").onclick=()=>go({tab:view.tab,pid:nextId,list,daily:view.daily});
    r.querySelector("#done").onclick=async()=>{ if(view.daily) await closeDay(); go({tab:view.tab}) };
    r.scrollIntoView({behavior:"smooth",block:"nearest"});
    await saveAttempt(a); if(view.daily && !nextId) await closeDay();
    if(p.src==="learn") await learnRecord(p,a);
  }
}

/* ---------- tests ---------- */
function renderTests(){
  const years=[...new Set(BOOK.map(p=>p.year))];
  app.innerHTML=`<div class="stack">${kipSay("Test day practice",`<p>A test is just puzzles with a clock. No hints during the test. Afterwards we look at every miss together.</p>`)}
   <div class="card stack"><div class="eyebrow">Team Level 5–6 sample</div><h3>60 minutes · 30 questions · 1000 points</h3><p class="small muted">Read each question from the printed sample. Questions 1–20 are 25 points, 21–30 are 50.</p><div><button class="btn" data-t="sample">Start the sample test</button></div></div>
   <div class="card stack"><div class="eyebrow">Practise one sample question at a time, with Kip</div><div class="list">${SAMPLE.map(item).join("")}</div></div>

const testPts=(paper,p)=>paper==="sample"?(p.n<=20?25:50):p.pts;
function renderTest(){
  const T=view.run; if(T.done) return testResult(); const qs=T.ids.map(id=>byId[id]);
  app.innerHTML=`<div class="stack"><div class="ptop"><span class="chip plain">${T.paper==="sample"?"Sample test":"Year "+T.paper+" paper"}</span><span class="timer" id="clock"></span></div>
   <div class="card"><div class="qgrid" id="qgrid"></div></div><div class="card stack" id="qcard"></div>
   <div class="row"><button class="btn dark" id="fin">Finish and score</button><span class="small muted" id="cnt"></span></div></div>`;
  const clock=app.querySelector("#clock"); const tick=()=>{ const left=T.limit-(Date.now()-T.start)/1000; clock.textContent=fmt(Math.max(0,left)); clock.classList.toggle("low",left<300); if(left<=0){T.done=true;render()} }; tick(); timerId=setInterval(tick,1000);
  const grid=()=>{ app.querySelector("#qgrid").innerHTML=qs.map((p,i)=>`<button class="qb ${T.answers[p.id]?"ans":""} ${i===T.cur?"cur":""}" data-i="${i}" aria-label="Question ${p.n}">${p.n}</button>`).join("");
    app.querySelectorAll(".qb").forEach(b=>b.onclick=()=>{T.cur=+b.dataset.i;grid();card()}); app.querySelector("#cnt").textContent=Object.keys(T.answers).length+" of "+qs.length+" answered" };
  const card=()=>{ const p=qs[T.cur]; const c=app.querySelector("#qcard"); const cur=T.answers[p.id]||"";
    c.innerHTML=`<div class="eyebrow">Question ${p.n} · ${testPts(T.paper,p)} points</div>${p.type==="mc"?`<div class="opts">${"ABCDE".split("").map(k=>`<button class="opt ${cur===k?"right":""}" data-k="${k}"><span class="k">${k}</span></button>`).join("")}</div>`:`<div class="row"><input class="num" id="tin" value="${esc(cur)}" placeholder="Answer" autocomplete="off"><button class="btn" id="ts">Save</button></div>`}
      <div class="row"><button class="btn ghost" id="pv" ${T.cur===0?"disabled":""}>← Previous</button><button class="btn ghost" id="nx" ${T.cur===qs.length-1?"disabled":""}>Next →</button></div>`;
    const adv=()=>{ if(T.cur<qs.length-1)T.cur++; grid(); card() };
    if(p.type==="mc") c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{T.answers[p.id]=b.dataset.k; adv()});
    else { const inp=c.querySelector("#tin"); const sv=()=>{const v=inp.value.trim(); if(v)T.answers[p.id]=v; else delete T.answers[p.id]; adv()}; c.querySelector("#ts").onclick=sv; inp.onkeydown=e=>{if(e.key==="Enter")sv()} }
    c.querySelector("#pv").onclick=()=>{T.cur--;grid();card()}; c.querySelector("#nx").onclick=()=>{T.cur++;grid();card()} };
  grid(); card(); app.querySelector("#fin").onclick=()=>{T.done=true; clearInterval(timerId); render()};
}
async function testResult(){
  const T=view.run; clearInterval(timerId); const qs=T.ids.map(id=>byId[id]);
  if(!T.scored){ let score=0,max=0; const miss=[]; qs.forEach(p=>{const w=testPts(T.paper,p); max+=w; const v=T.answers[p.id]; if(v&&isRight(p,v)) score+=w; else miss.push(p.id)});
    T.scored={score,max,miss,secs:Math.min(T.limit,Math.round((Date.now()-T.start)/1000))};
    await saveTest({key:"t"+Date.now(),paper:T.paper,score,max,missed:miss,secs:T.scored.secs,at:new Date().toISOString()}); }
  const {score,max,miss,secs}=T.scored;
  app.innerHTML=`<div class="stack">${kipSay("Test result",`<p><b>${score} out of ${max}</b> in ${fmt(secs)}. ${miss.length?`Now the best part: let's go through the ${miss.length} you missed, one at a time, with hints.`:"A perfect paper!"}</p>`)}
    ${miss.length?`<div class="list">${miss.map(id=>item(byId[id])).join("")}</div>`:""}<div><button class="btn ghost" id="home">Back to tests</button></div></div>`;
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go({tab:"test",pid:b.dataset.open,list:miss}));
  app.querySelector("#home").onclick=()=>go({tab:"test"});
}

function renderCoach(){
  const pr=practice(); const clean=pr.filter(isClean).length;
  const avgPct = pr.length? Math.round(100*pr.reduce((s,a)=>s+Math.min(2,a.secs/a.limit),0)/pr.length):0;
  const guessed=pr.filter(a=>a.guess!=null||a.crossed>0).length;
  const days=new Set(pr.map(a=>a.at.slice(0,10))).size;
  const d=today(); const tp=planResults(d);
  // alert: struggling today or on the last closed day
  const lastH=state.history[state.history.length-1];
  const struggling = tp && tp.res.filter(Boolean).length>=3 && (tp.clean/tp.res.filter(Boolean).length<0.4 || tp.shown>=2);
  const hardOnes = tp? tp.res.filter(a=>a && !isClean(a)).map(a=>byId[a.pid]) : [];
  const moveRows=MOVE_IDS.map(id=>{const xs=pr.filter(a=>a.move===id); if(!xs.length) return null; const c=xs.filter(isClean).length;
    return {id,t:xs.length,c,h:xs.filter(a=>a.correct&&!isClean(a)).length,s:xs.filter(a=>a.revealed).length,time:Math.round(100*xs.reduce((s,a)=>s+a.secs/a.limit,0)/xs.length)}}).filter(Boolean).sort((a,b)=>a.c/a.t-b.c/b.t);
  const dueList=POOL.filter(p=>{const dd=dueOn(latest(p.id)); return dd}).slice(0,30);
  const recent=[...pr].reverse().slice(0,20);
  app.innerHTML=`<div class="stack">
    <div><div class="eyebrow">For the grown-up</div><h2>How the thinking is going</h2><p class="small muted" style="margin-top:4px">${saveNote}.</p></div>
    ${struggling?`<div class="alert stack"><h3>Time to sit together</h3><p>Today was tough: ${tp.clean} of ${tp.res.filter(Boolean).length} solved alone. Go through these with him. Ask Kip's questions, and let him explain each step back to you.</p><div class="list">${hardOnes.map(item).join("")}</div></div>`:""}
    <div class="stats">
      <div class="stat"><div class="small muted">Level</div><div class="v">${state.level}</div>${levelBar(state.level)}</div>
      <div class="stat"><div class="small muted">Practice days</div><div class="v">${days}</div></div>
      <div class="stat"><div class="small muted">Solved alone, in time</div><div class="v">${pr.length?Math.round(100*clean/pr.length):0}%</div></div>
      <div class="stat"><div class="small muted">Time used vs allowed</div><div class="v">${avgPct}%</div></div>
      <div class="stat"><div class="small muted">Predicted first</div><div class="v">${pr.length?Math.round(100*guessed/pr.length):0}%</div></div>
    </div>
    <div class="card stack"><div class="eyebrow">Pace</div><p>Level ${state.level}: <b>${LEVELS[state.level-1].n} problems a day</b>, ${Math.round(LEVELS[state.level-1].f*100)}% of the starting time. Level goes up after a day with 75% or more solved alone and in time, and down after a day under 40%.</p>
      <div class="row"><button class="btn ghost" id="lvDown" ${state.level<=1?"disabled":""}>Easier</button><button class="btn ghost" id="lvUp" ${state.level>=5?"disabled":""}>Harder</button><span class="small muted">Changes start with tomorrow's set.</span></div></div>
    ${moveRows.length?`<div class="stack"><div class="eyebrow">Moves, weakest first</div><div class="tablewrap"><table><thead><tr><th>Move</th><th>Tried</th><th>Alone</th><th></th><th>With help</th><th>Shown</th><th>Time used</th></tr></thead><tbody>${moveRows.map(r=>`<tr><td>${MOVES[r.id].n}</td><td class="n">${r.t}</td><td class="n">${r.c}</td><td><div class="bar"><i style="width:${Math.round(100*r.c/r.t)}%"></i></div></td><td class="n">${r.h}</td><td class="n">${r.s}</td><td class="n">${r.time}%</td></tr>`).join("")}</tbody></table></div></div>`:`<div class="card muted">Results appear here after the first problems.</div>`}
    ${state.history.length?`<div class="stack"><div class="eyebrow">Daily sets</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Level</th><th>Alone</th><th>Shown</th><th>Next</th></tr></thead><tbody>${[...state.history].reverse().slice(0,30).map(h=>`<tr><td>${h.date}</td><td class="n">${h.level}</td><td class="n">${h.clean}/${h.total}</td><td class="n">${h.shown}</td><td>${h.change>0?"Up":h.change<0?"Down":"Same"}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div class="stack"><div class="eyebrow">Coming back for another try (${dueList.length})</div>${dueList.length?`<div class="list">${dueList.map(item).join("")}</div>`:`<p class="small muted">None right now.</p>`}</div>
    ${recent.length?`<div class="stack"><div class="eyebrow">Recent problems</div><div class="tablewrap"><table><thead><tr><th>Problem</th><th>Move</th><th>Result</th><th>Hints</th><th>Time</th><th>His move</th></tr></thead><tbody>${recent.map(a=>{const p=byId[a.pid]; return `<tr><td>${p?srcLabel(p):a.pid}</td><td>${MOVES[a.move]?.n||""}</td><td>${a.revealed?"Shown":isClean(a)?"Alone":a.correct?"With help":"–"}</td><td class="n">${a.hints}</td><td class="n">${fmt(a.secs)} / ${fmt(a.limit)}</td><td>${a.usedMove?(MOVES[a.usedMove]?.n||"Just saw it"):"–"}</td></tr>`}).join("")}</tbody></table></div></div>`:""}
    <div class="card stack"><div class="eyebrow">Why it's built this way</div>
      <p><b>Try first, then learn.</b> Kids who wrestle with a problem before being shown the method learn more from the explanation. Kip asks questions instead of giving steps. <a href="https://evidencebasedliving.human.cornell.edu/blog/to-better-learn-students-must-first-fail" target="_blank" rel="noopener">Productive failure research</a></p>
      <p><b>Mixed, not blocked.</b> Each day's set mixes different moves, so he has to work out which move fits. In a classroom trial, mixed practice scored 61% against 38% on a delayed test. <a href="https://ies.ed.gov/use-work/awards/efficacy-study-interleaved-mathematics-practice" target="_blank" rel="noopener">Rohrer et al.</a></p>
      <p><b>Spaced comebacks.</b> A problem that needed help returns after 3 days; one he was shown returns the next day.</p>
      <p><b>Predict and explain.</b> Guessing first, crossing out impossible choices and naming the move afterwards build the habit of checking what's being asked. <a href="https://web.education.wisc.edu/pmatthews/wp-content/uploads/sites/35/2012/12/matthews-Rittle-Johnson-2009.pdf" target="_blank" rel="noopener">Self-explanation study</a></p>
      <p><b>When you step in:</b> ask Kip's questions in order. "What do they want?" "What's your guess?" "Which move?" "Does it fit every sentence?" Let him do the writing.</p></div>
  </div>`;
  app.querySelector("#lvDown").onclick=async()=>{ state.level=Math.max(1,state.level-1); delete state.plans[today()+"_x"]; await saveState(); renderCoach() };
  app.querySelector("#lvUp").onclick=async()=>{ state.level=Math.min(5,state.level+1); await saveState(); renderCoach() };
  bindOpen(dueList.map(p=>p.id));
}

const SKM=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
function genProblem(sid,seed){ const s=SKM[sid]; const q=s.make(rng(sid+"|"+seed));
  const p={id:`L-${sid}-${seed}`,src:"learn",skill:sid,g:s.g,move:s.move,pts:s.g<=3?3:s.g<=8?4:5,type:q.type||"num",text:q.text,opts:q.opts||null,ans:String(q.ans),tol:q.tol,show:q.show,hints:q.hints,why:q.why,fig:"",title:s.t,life:s.life};
  byId[p.id]=p; return p }

let learner=lsGet("kmg_learner",null);
async function saveLearner(){ learner.updated=new Date().toISOString(); lsSet("kmg_learner",learner); if(db){ try{ await db.doc("app/learner").set(learner) }catch(e){} } }
const skStat=id=>(learner.stats[id]||{t:0,c:0,streak:0,m:false});
function skStatus(s){ const st=learner.stats[s.id]; if(st&&st.m) return "mastered"; if(s.g<learner.level) return "assumed"; if(s.g===learner.level) return "now"; if(s.g===learner.level+1) return "stretch"; return "later" }
async function learnRecord(p,a){
  const st={...skStat(p.skill)}; st.t++; const clean=a.correct&&a.hints===0; if(clean){st.c++;st.streak++} else st.streak=0; if(st.streak>=3) st.m=true; st.last=a.at.slice(0,10);
  learner.stats[p.skill]=st; let msg="";
  const cur=SKILLS.filter(s=>s.g===learner.level);
  if(cur.length && cur.every(s=>(learner.stats[s.id]||{}).m) && learner.level<12){ learner.level++; msg=`Level up! You're now learning ${gName(learner.level)} skills.` }
  await saveLearner();
  if(st.m && st.streak===3) msg = (msg?msg+" ":"")+`You mastered "${SKM[p.skill].t}"!`;
  if(msg){ const r=document.querySelector("#result .result"); if(r) r.insertAdjacentHTML("afterbegin",kipSay("Kip says",`<p><b>${esc(msg)}</b></p>`)) }
}
function learnPlan(){
  const d=today(); if(learner.plans&&learner.plans[d]) return learner.plans[d];
  const R=rng("learn"+d+learner.level); const L=learner.level;
  const now=SKILLS.filter(s=>s.g===L&&!(learner.stats[s.id]||{}).m);
  const below=SKILLS.filter(s=>s.g<L||(learner.stats[s.id]||{}).m);
  const stretch=SKILLS.filter(s=>s.g===L+1);
  const pick=[]; if(below.length) pick.push(pk(R,below));
  const pool=now.length?now:SKILLS.filter(s=>s.g===L);
  for(let i=0;i<3;i++) pick.push(pool[i%pool.length]);
  if(stretch.length) pick.push(pk(R,stretch)); else if(pool.length) pick.push(pk(R,pool));
  // interleave so the same skill is not twice in a row
  for(let i=1;i<pick.length;i++) if(pick[i].id===pick[i-1].id){ const j=pick.findIndex((s,k)=>k>i&&s.id!==pick[i].id); if(j>0)[pick[i],pick[j]]=[pick[j],pick[i]] }
  learner.plans=learner.plans||{}; learner.plans[d]=pick.map((s,i)=>[s.id,d+"-"+i]);
  const ks=Object.keys(learner.plans).sort(); while(ks.length>30) delete learner.plans[ks.shift()];
  saveLearner(); return learner.plans[d];
}

function renderLearn(){
  if(!learner || !learner.placed) return learnOnboard();
  const plan=learnPlan(); const ps=plan.map(([sid,seed])=>genProblem(sid,seed));
  const res=ps.map(p=>practice().find(a=>a.pid===p.id)); const next=res.findIndex(a=>!a);
  const dots=res.map(a=>`<span class="dot ${!a?"":a.revealed?"shown":isClean(a)?"clean":"helped"}"></span>`).join("");
  const mastered=SKILLS.filter(s=>(learner.stats[s.id]||{}).m).length;
  const chip={mastered:'<span class="chip good">Mastered</span>',assumed:'<span class="chip plain">Review</span>',now:'<span class="chip">Learning now</span>',stretch:'<span class="chip blue">Stretch</span>',later:'<span class="chip plain">Challenge</span>'};
  app.innerHTML=`<div class="stack">
    ${kipSay(`Hi ${esc(learner.nick)}!`, next===-1?`<p>Today's real-life set is done. Want more? Pick any skill below. Even the 'Challenge' ones: every brain can learn anything when it's taken one step at a time.</p>`:`<p>You're learning <b>${gName(learner.level)}</b> skills. Today: ${ps.length} real-life problems: one review, three at your level and one stretch. Guess first, then solve.</p>`)}
    <div class="card stack"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Today's real-life set</div><div class="dots" style="margin-top:6px">${dots}</div></div><div style="text-align:right"><div class="eyebrow">${mastered} of ${SKILLS.length} skills mastered</div></div></div>
      ${next===-1?"":`<div><button class="btn" id="lgo">${next===0?"Start":"Continue"} →</button></div>`}</div>
    <div class="stack"><div class="eyebrow">The ladder, Kindergarten to Grade 12</div>
      ${[...Array(13).keys()].map(g=>{const ss=SKILLS.filter(s=>s.g===g); return `<div class="card stack" style="padding:14px"><div class="row" style="justify-content:space-between"><h3>${gName(g)}</h3>${g===learner.level?'<span class="chip">You are here</span>':""}</div>
        <div class="list">${ss.map(s=>`<button class="item" data-sk="${s.id}"><span class="l"><b>${s.t}</b><br><span class="small muted">${STRANDS[s.st]} · Real life: ${s.life}</span></span>${chip[skStatus(s)]}</button>`).join("")}</div></div>`}).join("")}
    </div>
    <div class="card stack"><div class="eyebrow">How Kip teaches</div>
      <p><b>Real life first.</b> Every problem starts from something you'd really do: shopping, cooking, saving, building, travelling.</p>
      <p><b>Picture, then numbers.</b> Hints move from "draw it" to "picture it" to the numbers, like the concrete-pictorial-abstract steps used in Singapore maths.</p>
      <p><b>Placed by what you can do, not your age.</b> Finish a level and you move up, even past your grade.</p>
      <p><b>Mastery means 3 in a row alone.</b> Skills come back mixed with others so you have to choose the move yourself.</p>
      <div class="row"><button class="btn ghost" id="replace">Redo placement check</button><button class="btn ghost" id="edit">Change name or grade</button></div></div>
  </div>`;
  const g=app.querySelector("#lgo"); if(g) g.onclick=()=>go({tab:"learn",pid:ps[next].id,list:ps.map(p=>p.id)});
  app.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{ const t=Date.now(); const xs=[0,1,2].map(i=>genProblem(b.dataset.sk,"p"+t+i)); go({tab:"learn",pid:xs[0].id,list:xs.map(p=>p.id)}) });
  app.querySelector("#replace").onclick=()=>startPlacement();
  app.querySelector("#edit").onclick=()=>{ learner.placed=false; learnOnboard(true) };
}
function learnOnboard(editing){
  const L=learner||{};
  app.innerHTML=`<div class="stack">${kipSay("Let's get started",`<p>Tell me a little about you. Then I'll ask 8 quick questions to find the right starting step. It's not a test. Wrong answers help me find your level.</p>`)}
   <form class="card stack" id="ob"><label class="stack" style="gap:4px"><span class="eyebrow">Nickname</span><input id="nick" class="num" style="width:260px;font-family:var(--body)" maxlength="20" value="${esc(L.nick||"")}" placeholder="What should Kip call you?" required></label>
   <div class="row"><label class="stack" style="gap:4px"><span class="eyebrow">Age</span><input id="age" class="num" type="number" min="4" max="19" style="width:110px" value="${L.age||""}" required></label>
   <label class="stack" style="gap:4px"><span class="eyebrow">Grade</span><select id="grade" class="num" style="width:160px">${[...Array(13).keys()].map(g=>`<option value="${g}" ${L.grade===g?"selected":""}>${gName(g)}</option>`).join("")}</select></label></div>
   <p class="small muted">Only a nickname, no full names. It stays on this page.</p>
   <div><button class="btn" type="submit">${editing?"Save":"Next: placement check"}</button></div></form></div>`;
  app.querySelector("#ob").onsubmit=async e=>{ e.preventDefault();
    learner={...(learner||{stats:{},plans:{}}),nick:app.querySelector("#nick").value.trim()||"friend",age:+app.querySelector("#age").value,grade:+app.querySelector("#grade").value};
    if(editing&&learner.level!=null){ learner.placed=true; await saveLearner(); renderLearn() } else { await saveLearner(); startPlacement() } };
}
function startPlacement(){ go({tab:"learn",place:{i:0,cur:learner.grade,asked:[],seed:Date.now()}}) }
function renderPlacement(){
  const P=view.place, N=8;
  if(P.i>=N){ const last=P.asked.slice(-4).map(x=>x.g); let lvl=Math.round(last.reduce((a,b)=>a+b,0)/last.length);
    const rightG=P.asked.filter(x=>x.ok).map(x=>x.g); if(rightG.length) lvl=Math.max(lvl,Math.min(...rightG)); lvl=Math.max(0,Math.min(12,lvl));
    learner.level=lvl; learner.placed=true; learner.plans={}; learnerSaveAndShow(lvl); return }
  const pool=SKILLS.filter(s=>s.g===P.cur); const s=pool[(P.i+P.seed)%pool.length]; const p=genProblem(s.id,"place"+P.seed+P.i);
  app.innerHTML=`<div class="stack"><div class="ptop"><span class="chip plain">Placement · ${P.i+1} of ${N}</span><span class="chip blue">${gName(s.g)}</span></div>
   <div class="card stack"><div class="small muted">Real life: ${s.life}</div><div class="ptext">${esc(p.text)}</div>
   ${p.type==="mc"?`<div class="opts">${p.opts.map((o,i)=>`<button class="opt" data-k="${"ABCDE"[i]}"><span class="k">${"ABCDE"[i]}</span>${esc(o)}</button>`).join("")}</div>`:`<div class="row"><input id="pa" class="num" placeholder="Answer" autocomplete="off"><button class="btn" id="pc">Next</button></div>`}
   <div class="row"><button class="btn ghost" id="pskip">I haven't learned this yet</button></div></div></div>`;
  const step=ok=>{ P.asked.push({g:P.cur,ok}); P.cur=ok?Math.min(12,P.cur+1):Math.max(0,P.cur-1); P.i++; render() };
  if(p.type==="mc") app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>step(isRight(p,b.dataset.k)));
  else { const inp=app.querySelector("#pa"); const go2=()=>{ if(inp.value.trim()) step(isRight(p,inp.value)) }; app.querySelector("#pc").onclick=go2; inp.onkeydown=e=>{if(e.key==="Enter")go2()}; inp.focus() }
  app.querySelector("#pskip").onclick=()=>step(false);
}
async function learnerSaveAndShow(lvl){
  await saveLearner();
  app.innerHTML=`<div class="stack">${kipSay("Found your starting step!",`<p>You'll start with <b>${gName(lvl)}</b> skills${lvl>learner.grade?", ahead of your grade. Brilliant":lvl<learner.grade?". We'll build a strong base first, then climb fast":", right at your grade"}. Every day: one review, three at your level and one stretch.</p>`)}
    <div><button class="btn" id="tolearn">See my ladder →</button></div></div>`;
  app.querySelector("#tolearn").onclick=()=>go({tab:"learn"});
}

render(); initDb();
</script>
